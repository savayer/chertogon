<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- asset paths in the shared modules are relative to the game's root -->
  <base href="../">
  <title>Чертогон: 3D-мир</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #120b1a;
      --card: #231733;
      --text: #f5f0ff;
      --muted: #b9a9d0;
      --accent: #ff7a1a;
      --accent-2: #7cc242;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; overflow: hidden; }
    body { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
    #wrap > canvas { grid-area: 1 / 1; display: block; width: min(100vw, calc(100dvh * 960 / 544)); aspect-ratio: 960 / 544; touch-action: none; }
    #gl { background: #000; image-rendering: pixelated; }
    #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 5, 16, 0.78); overflow: auto; }
    .card { display: flex; flex-direction: column; gap: 14px; max-width: 520px; width: 100%; background: var(--card); border-radius: 18px; padding: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); margin: auto; }
    .card h1 { margin: 0; text-align: center; font-size: clamp(22px, 4vw, 34px); letter-spacing: 1px; color: var(--accent); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 12px 16px; font: inherit; font-weight: 700; font-size: 16px; color: #1a1126; background: var(--accent); cursor: pointer; text-decoration: none; }
    .btn.secondary { background: #3b2a52; color: var(--text); }
    .btn.green { background: var(--accent-2); }
    .btn:disabled { opacity: 0.5; cursor: progress; }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row > * { flex: 1; }
    #status { min-height: 1.3em; color: var(--muted); font-size: 14px; }
    .help { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .help b { color: var(--text); }
    .lang { display: flex; gap: 4px; justify-content: flex-end; }
    .lang button { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 9px; border: 0; border-radius: 8px; background: #3b2a52; color: var(--muted); cursor: pointer; }
    .lang button[aria-pressed="true"] { background: var(--accent); color: #1a1126; }
    .lang button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    #death { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card.death { max-width: 440px; text-align: center; gap: 12px; }
    .card.death p { margin: 0; color: var(--muted); }
    .touch { display: none; position: fixed; inset: auto 0 0 0; padding: 12px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); justify-content: space-between; align-items: flex-end; pointer-events: none; }
    .touch .pad { display: flex; gap: 12px; pointer-events: auto; }
    .touch button { width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.16); color: #fff; font-size: 26px; touch-action: none; }
    .touch button.on { background: rgba(255, 122, 26, 0.55); }
    #stick { position: relative; width: 140px; height: 140px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.08); pointer-events: auto; touch-action: none; }
    #knob { position: absolute; left: 40px; top: 40px; width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); pointer-events: none; }
    #rotate { display: none; position: fixed; top: 12px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 14px; pointer-events: none; }
    @media (pointer: coarse) {
      body.playing .touch { display: flex; }
      body.playing #rotate { display: block; }
    }
    @media (orientation: landscape) { #rotate { display: none !important; } }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="gl" width="960" height="544"></canvas><canvas id="game" width="960" height="544"></canvas></div>
  <div class="touch" aria-hidden="true">
    <div id="stick"><div id="knob"></div></div>
    <div class="pad">
      <button data-key="fire">🔥</button>
      <button data-key="jump">⤒</button>
    </div>
  </div>
  <div id="rotate" data-i18n="rotate">Поверни телефон горизонтально — так удобнее</div>
  <div id="menu">
    <div class="card">
      <div class="lang" role="group" aria-label="Language / Язык">
        <button data-lang="ru" aria-pressed="true">RU</button>
        <button data-lang="en" aria-pressed="false">EN</button>
        <button id="sound" data-i18n-aria="sound" aria-label="Звук" aria-pressed="true">🔊</button>
      </div>
      <h1 data-i18n="worldTitle">Чертогон: 3D-мир</h1>
      <div class="row">
        <button class="btn" id="play" data-i18n="play" disabled>▶ Играть</button>
        <button class="btn green" id="continue" data-i18n="continue" hidden>Продолжить</button>
      </div>
      <div class="row">
        <a class="btn secondary" href="index.html" data-i18n="worldBack">← К обычной игре</a>
      </div>
      <div id="status" role="status"></div>
      <div class="help" data-i18n-html="worldHelp"></div>
    </div>
  </div>
  <div id="death" hidden>
    <div class="card death" role="dialog" aria-labelledby="death-title">
      <h1 id="death-title">Игрок в нокауте</h1>
      <p id="death-cause"></p>
      <div class="row">
        <button class="btn" id="retry" data-i18n="retry">↻ Ещё раз</button>
        <button class="btn secondary" id="restart" data-i18n="restart">Заново</button>
      </div>
      <p class="help" data-i18n="deathHelp">Ещё раз — с последнего флажка. Заново — с первого уровня. Enter — ещё раз.</p>
    </div>
  </div>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }</script>
  <script type="module" src="world/main.js"></script>
</body>
</html>
